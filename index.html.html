BOOKS.sort((a,b)=>a.ddc.localeCompare(b.ddc,undefined,{numeric:true})||a.title.localeCompare(b.title));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>(s||'').toLowerCase();
let showAll=true;
function hl(t,terms){let out=esc(t);terms.forEach(w=>{if(!w)return;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');out=out.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(re,'<mark>$1</mark>'))});return out}
function render(){
  const raw=$('q').value.trim(),q=norm(raw);
  if(!q&&!showAll){$('wrap').hidden=true;$('count').textContent='';return}
  let y1=0,y2=0,terms=[];
  const m=q.match(/^(\d{4})\s*(?:-|to)\s*(\d{4})$/);
  if(m){y1=+m[1];y2=+m[2]}else terms=q.split(/\s+/).filter(Boolean);
  const r=BOOKS.filter(b=>{
    if(y1){const y=parseInt(b.year);return y>=y1&&y<=y2}
    const hay=norm([b.ddc,b.title,b.auth,b.year,b.acc].join(' | '));
    return terms.every(t=>hay.includes(t))});
  $('count').textContent=r.length+(r.length===1?' book found':' books found')+(q?'':' (all books)');
  if(!r.length){$('wrap').hidden=true;$('count').innerHTML=esc(raw)?'No book found for "'+esc(raw)+'". Try a shorter DDC number or another spelling.':'';return}
  $('body').innerHTML=r.map(b=>`<tr><td>${hl(b.title,terms)}</td><td>${b.auth?hl(b.auth,terms):''}</td><td class="y">${b.year?hl(b.year,terms):'n.d.'}</td><td class="y">${b.ddc?hl(b.ddc,terms):''}</td><td class="y">${b.acc?hl(b.acc,terms):''}</td></tr>`).join('');
  $('wrap').hidden=false;
}
$('q').addEventListener('input',render);
$('clr').onclick=()=>{$('q').value='';render();$('q').focus()};
render();
